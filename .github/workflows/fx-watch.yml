name: fx-watch

on:
  schedule:
    - cron: "*/10 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install pandas numpy

      - name: Run FX watcher
        run: python fx_watch.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: practice
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Save state
        run: |
          git config user.name "fx-watch"
          git config user.email "fx-watch@users.noreply.github.com"
          git add fx_state.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
